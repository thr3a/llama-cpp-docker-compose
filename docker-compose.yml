x-common-settings: &common-settings
  volumes:
    - ./cache:/root/.cache:ro
  environment:
    TZ: Asia/Tokyo
  tty: true
  stop_grace_period: 0s
  ipc: host
  security_opt:
    - seccomp:unconfined
  env_file:
    - .env

services:
  main:
    <<: *common-settings
    image: kyuz0/amd-strix-halo-toolboxes:rocm-7.2.4_20260621T045312
    ports:
      - "8000:8000"
    devices:
      - "/dev/dri:/dev/dri"
    privileged: true
    restart: always
    command: >
      /usr/local/bin/llama-server
      --host 0.0.0.0
      --port 8000
      --model /root/.cache/llama.cpp/gemma-4-26B-A4B-it-Q8_0.gguf
      -ngl 99 --ctx-size 262144 -a gpt-4o-mini --flash-attn on --threads 16 --no-mmap --direct-io
      --jinja
      --cache-type-k q8_0 --cache-type-v q8_0 --ubatch-size 2048 --batch-size 2048

