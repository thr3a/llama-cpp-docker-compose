x-common-settings: &common-settings
  volumes:
    - ./models:/models:ro
  environment:
    TZ: Asia/Tokyo
  tty: true
  stop_grace_period: 0s
  ipc: host
  security_opt:
    - seccomp:unconfined
  env_file:
    - .env

services:
  main:
    <<: *common-settings
    image: kyuz0/amd-strix-halo-toolboxes:vulkan-radv-performance_20260822T090617
    ports:
      - "8000:8000"
    devices:
      - "/dev/dri:/dev/dri"
    privileged: true
    restart: always
    # --no-mmap --direct-io
    command: >
      /usr/bin/llama-server
      --host 0.0.0.0
      --port 8000
      -m /models/gemma-4-26B-A4B/gemma-4-26B-A4B-it-Q8_0.gguf
      -md /models/gemma-4-26B-A4B/mtp-gemma-4-26B-A4B-it-Q8_0.gguf
      --mmproj /models/gemma-4-26B-A4B/mmproj-BF16.gguf
      -ngl 99 -c 262144 -a gpt-4o-mini --flash-attn on --threads 16
      --jinja
      -ctv q8_0 -ctk q8_0 --ubatch-size 2048 --batch-size 2048
      --spec-type draft-mtp --spec-draft-n-max 4
