x-common-settings: &common-settings
  volumes:
    - ./models:/models:ro
  environment:
    TZ: Asia/Tokyo
  tty: true
  stop_grace_period: 0s
  ipc: host
  security_opt:
    - seccomp:unconfined
  env_file:
    - .env

services:
  main:
    <<: *common-settings
    image: kyuz0/amd-strix-halo-toolboxes:rocm-7.14_20260822T083627
    ports:
      - "8000:8000"
    devices:
      - "/dev/dri:/dev/dri"
    privileged: true
    restart: always
    # --no-mmap --direct-io
    command: >
      /usr/local/bin/llama-server
      --host 0.0.0.0
      --port 8000
      --model /models/Qwen3.8-27B-UD-Q4_K_M.gguf
      -ngl 99 --ctx-size 262144 -a gpt-4o-mini --flash-attn on --threads 16
      --jinja
      --cache-type-k q8_0 --cache-type-v q8_0 --ubatch-size 2048 --batch-size 2048
